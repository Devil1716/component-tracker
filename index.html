<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Amity Component Tracker</title>
    <meta name="description" content="A lightweight desktop-friendly component checkout tracker for lab teams.">
    <meta name="theme-color" content="#1B325D">
    <link rel="manifest" href="manifest.webmanifest">
    <link rel="icon" href="assets/icon.svg" type="image/svg+xml">
    <link rel="apple-touch-icon" href="assets/icon.svg">
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <!-- No external icon lib, using inline SVG -->
</head>

<body>

    <!-- ───── Sidebar ───── -->
    <aside id="sidebar">
        <div class="sidebar-header">
            <div>
                <h1>Amity</h1>
                <p class="subtitle">Component Log</p>
            </div>
            <button id="sidebarToggle" class="sidebar-toggle" title="Toggle Sidebar">
                <svg width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M4 6h16M4 12h16M4 18h16"></path>
                </svg>
            </button>
        </div>

        <div class="team-add">
            <input type="text" id="teamNameInput" placeholder="New Team Name...">
            <button id="addTeamBtn">
                <svg width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M12 4v16m8-8H4"></path>
                </svg>
            </button>
        </div>

        <div class="team-list" id="teamList">
            <!-- Team items here -->
        </div>

        <button class="btn-stock" id="stockBtn" title="Stock Inventory">
            <svg width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round"
                    d="M20 7l-8-4-8 4m16 0l-8 4m8-4v10l-8 4m0-10L4 7m8 4v10M4 7v10l8 4"></path>
            </svg>
            <span>Stock</span>
        </button>

        <div class="sidebar-footer">
            <button class="btn-stock" id="dailyBtn" title="Activity Log">
                <svg width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round"
                        d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z">
                    </path>
                </svg>
                <span>Activity Log</span>
            </button>
            <button class="btn-summary" id="summaryBtn" title="Summary">
                <svg width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round"
                        d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z">
                    </path>
                </svg>
                <span>Summary</span>
            </button>
            <button class="btn-export" id="exportBtn" title="Export CSV">
                <svg width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round"
                        d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"></path>
                </svg>
                <span>Export</span>
            </button>
        </div>
    </aside>

    <!-- ───── Main Content ───── -->
    <main id="main">
        <div id="emptyState" class="empty-state">
            <div class="empty-icon">
                <svg width="64" height="64" fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24"
                    style="margin:0 auto">
                    <path stroke-linecap="round" stroke-linejoin="round"
                        d="M17 20h5v-2a3 3 0 00-5.356-1.857M17 20H7m10 0v-2c0-.656-.126-1.283-.356-1.857M7 20H2v-2a3 3 0 015.356-1.857M7 20v-2c0-.656.126-1.283.356-1.857m0 0a5.002 5.002 0 019.288 0M15 7a3 3 0 11-6 0 3 3 0 016 0zm6 3a2 2 0 11-4 0 2 2 0 014 0zM7 10a2 2 0 11-4 0 2 2 0 014 0z">
                    </path>
                </svg>
            </div>
            <h2>Select a Team</h2>
            <p>Choose a team from the sidebar to manage their component checkouts.</p>
        </div>

        <div id="teamView" class="team-view hidden">
            <div class="team-header">
                <h2 id="teamTitle">Team Alpha</h2>
                <button class="btn-delete" id="deleteTeamBtn">Delete Team</button>
            </div>

            <div class="component-entry glass">
                <h3>Add Component</h3>
                <div class="entry-row">
                    <div style="flex:1;min-width:240px;position:relative">
                        <input list="componentList" id="componentSelect" placeholder="Search by ID or Name..."
                            style="width:100%">
                        <datalist id="componentList">
                            <!-- Options populated by JS -->
                        </datalist>
                    </div>
                    <input type="number" id="quantityInput" value="1" min="1">
                    <button class="btn-log" id="logComponentBtn">Log Item</button>
                </div>
                <div class="stock-hint" id="stockHint"></div>
            </div>

            <div class="inventory glass">
                <h3>Checked-Out Components</h3>
                <table>
                    <thead>
                        <tr>
                            <th>#</th>
                            <th>Component Name</th>
                            <th>Quantity</th>
                            <th>Time</th>
                            <th>Action</th>
                        </tr>
                    </thead>
                    <tbody id="inventoryBody">
                        <!-- Rows here -->
                    </tbody>
                </table>
                <div id="noItemsMsg" class="no-items">No components logged for this team.</div>
            </div>
        </div>
    </main>

    <!-- ───── Modals ───── -->
    <div id="summaryModal" class="modal-overlay hidden">
        <div class="modal">
            <div class="modal-header">
                <h2>Total Summary</h2>
                <button class="modal-close" id="closeSummary">&times;</button>
            </div>
            <div class="modal-body" id="summaryContent"></div>
        </div>
    </div>

    <div id="stockModal" class="modal-overlay hidden">
        <div class="modal">
            <div class="modal-header">
                <h2>Stock Inventory</h2>
                <button class="modal-close" id="closeStock">&times;</button>
            </div>
            <div class="modal-search">
                <input type="text" id="stockSearch" placeholder="Search component...">
            </div>
            <div class="modal-body" id="stockContent"></div>
        </div>
    </div>

    <div id="dailyModal" class="modal-overlay hidden">
        <div class="modal">
            <div class="modal-header">
                <h2>Activity Log</h2>
                <button class="modal-close" id="closeDaily">&times;</button>
            </div>
            <div class="date-nav">
                <button class="date-nav-btn" id="prevDay" aria-label="Previous day">&larr;</button>
                <div class="date-label" id="currentDate">Today</div>
                <button class="date-nav-btn" id="nextDay" aria-label="Next day">&rarr;</button>
            </div>
            <div class="modal-body" id="dailyContent"></div>
        </div>
    </div>

    <script src="app.js"></script>
    <script>
        if ('serviceWorker' in navigator && location.protocol !== 'file:') {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('sw.js').catch(() => {});
            });
        }
    </script>
</body>

</html>
