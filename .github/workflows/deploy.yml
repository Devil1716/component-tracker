name: Deploy Component Tracker

on:
  push:
    branches: ["main", "master"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Create runtime config
        env:
          FIREBASE_API_KEY: ${{ secrets.FIREBASE_API_KEY }}
          FIREBASE_AUTH_DOMAIN: ${{ secrets.FIREBASE_AUTH_DOMAIN }}
          FIREBASE_DATABASE_URL: ${{ secrets.FIREBASE_DATABASE_URL }}
          FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
          FIREBASE_STORAGE_BUCKET: ${{ secrets.FIREBASE_STORAGE_BUCKET }}
          FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.FIREBASE_MESSAGING_SENDER_ID }}
          FIREBASE_APP_ID: ${{ secrets.FIREBASE_APP_ID }}
          FIREBASE_MEASUREMENT_ID: ${{ secrets.FIREBASE_MEASUREMENT_ID }}
          ADMIN_EMAIL: ${{ secrets.ADMIN_EMAIL }}
          REMINDER_EMAIL_ENDPOINT: ${{ secrets.REMINDER_EMAIL_ENDPOINT }}
        run: |
          REMINDER_EMAIL_ENDPOINT="${REMINDER_EMAIL_ENDPOINT:-https://asia-south1-component-tracker-cd000.cloudfunctions.net/sendReminderEmails}"
          cat > firebase-config.js <<EOF
          window.COMPONENT_TRACKER_CONFIG = {
            environment: 'production',
            firebase: {
              apiKey: '$FIREBASE_API_KEY',
              authDomain: '$FIREBASE_AUTH_DOMAIN',
              databaseURL: '$FIREBASE_DATABASE_URL',
              projectId: '$FIREBASE_PROJECT_ID',
              storageBucket: '$FIREBASE_STORAGE_BUCKET',
              messagingSenderId: '$FIREBASE_MESSAGING_SENDER_ID',
              appId: '$FIREBASE_APP_ID',
              measurementId: '$FIREBASE_MEASUREMENT_ID'
            },
            auth: {
              mode: 'firebase',
              adminEmail: '$ADMIN_EMAIL'
            },
            email: {
              reminderEndpoint: '$REMINDER_EMAIL_ENDPOINT'
            },
            databasePaths: {
              production: 'componentTracker/production/state',
              testing: 'componentTracker/testing/state'
            }
          };
          EOF
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
